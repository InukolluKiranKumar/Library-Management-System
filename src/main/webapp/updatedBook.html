<style>
	body {

	padding: 6px;

table {
	border-collapse: collapse;
}

	border: 1px solid #999;

	background-color: #2980b9;

<body>
<h1>UPDATE AN EXISTING BOOK</h1>
<form action="UpdateBook" method="post">

<input type="number" name="id" placeholder="Enter book id" required/><br><br>
<input type="text" name="bname" placeholder="Enter new bookname" required/><br><br>
<input type="text" name="author" placeholder="Enter new author name" required/><br><br>
<input type="text" name="btype" placeholder="Enter new book type" required/><br><br>
<input type="number" name="price" placeholder="Enter new price" required/><br><br>

<input type="submit" value="Update Book">


</form>
